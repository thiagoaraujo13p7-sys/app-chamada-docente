<!DOCTYPE html>
<html lang="pt">
<head>
<link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Chamada Docente</title>
  <!-- Biblioteca oficial do leitor de QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .teacher-info {
      text-align: right;
    }

    .teacher-name {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }

    .teacher-email {
      font-size: 11px;
      color: #64748b;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .meta-label {
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
    }

    .meta-value input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .btn-manual {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-qr {
      background-color: #0284c7;
      color: white;
    }

    /* Janela da Câmara em Direto */
    #reader-container {
      display: none;
      margin-bottom: 20px;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      padding: 12px;
      text-align: center;
    }

    #reader {
      width: 100% !important;
      border-radius: 8px;
    }

    .finish-cam-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 700;
      margin-top: 12px;
      cursor: pointer;
      width: 100%;
    }

    #alert-box {
      display: none;
      background-color: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
    }

    #manual-form {
      display: none;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
    }

    #manual-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 13px;
    }

    .add-btn {
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-weight: 700;
      cursor: pointer;
    }

    .history-section {
      margin-top: 20px;
    }

    .history-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-bottom: 15px;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      color: #334155;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 700;
    }

    .save-drive-btn {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-top">
      <h2 class="header-title">Minha Turma</h2>
      <div class="teacher-info">
        <div class="teacher-name">Thiago Thielmann de Araújo</div>
        <div class="teacher-email">thiago.araujo@usu.edu.br</div>
      </div>
    </div>

    <!-- Metadados da Turma/Aula -->
    <div class="meta-grid">
      <div class="meta-label">Instituição</div>
      <div class="meta-value"><input type="text" id="inst" value="Universidade Santa Úrsula"></div>
      
      <div class="meta-label">Curso</div>
      <div class="meta-value"><input type="text" id="curso" value="Arquitetura"></div>
      
      <div class="meta-label">Disciplina</div>
      <div class="meta-value"><input type="text" id="disc" value="Materiais de Construção"></div>
      
      <div class="meta-label">Turma</div>
      <div class="meta-value"><input type="text" id="turma" value="1ENGEM1052"></div>
      
      <div class="meta-label">Data</div>
      <div class="meta-value"><input type="text" id="data-aula" value="16/10/2026"></div>
    </div>

    <!-- Alerta de Sucesso -->
    <div id="alert-box"></div>

    <!-- Opções -->
    <div class="menu-options">
      <button class="option-btn btn-manual" onclick="abrirFormularioManual()">
        ✏️ 1 - Digitar nomes presentes manualmente
      </button>
      <button class="option-btn btn-qr" onclick="iniciarLeitorQR()">
        📷 2 - Ler o QR code dos presentes (Câmara)
      </button>
    </div>

    <!-- Janela da Câmara -->
    <div id="reader-container">
      <div style="color: white; font-size: 12px; margin-bottom: 8px; font-weight: 600;">Aponte para o QR Code do Estudante</div>
      <div id="reader"></div>
      <button class="finish-cam-btn" onclick="pararLeitorQR()">Finalizar Leitura</button>
    </div>

    <!-- Formulário Manual -->
    <div id="manual-form">
      <input type="text" id="man-nome" placeholder="Nome Completo do Estudante">
      <input type="text" id="man-mat" placeholder="Número de Matrícula">
      <button class="add-btn" onclick="adicionarManual()">Adicionar à Chamada</button>
    </div>

    <!-- Tabela de Presenças -->
    <div class="history-section">
      <div class="history-title">Histórico de Presenças do Dia</div>
      <div style="overflow-x: auto;">
        <table id="tabela-presenca">
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nome do Estudante</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr id="empty-row"><td colspan="3" style="text-align: center; color: #94a3b8;">Nenhum aluno registado ainda.</td></tr>
          </tbody>
        </table>
      </div>
      
      <button class="save-drive-btn" onclick="salvarNoGoogleDrive()">💾 Salvar Planilha no Google Drive</button>
    </div>
  </div>

  <script>
    // URL DO SEU WEB APP DO GOOGLE APPS SCRIPT (COLE AQUI O LINK /exec)
    const URL_API_GAS = https://script.google.com/macros/s/AKfycbyGT_e86Li89y7UNF-1u8WSZJFU_kq9MdwHawwn-zvCosFbYfDC2XbI72ptcs7sXTTQTQ/exec;

    let html5QrCode = null;
    let listaPresenca = [];

    function abrirFormularioManual() {
      const form = document.getElementById('manual-form');
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    function adicionarManual() {
      const nome = document.getElementById('man-nome').value.trim();
      const mat = document.getElementById('man-mat').value.trim();

      if (!nome || !mat) {
        alert("Preencha o nome e a matrícula.");
        return;
      }

      registrarPresenca(nome, mat);
      document.getElementById('man-nome').value = '';
      document.getElementById('man-mat').value = '';
    }

    function registrarPresenca(nome, matricula) {
      if (listaPresenca.some(item => item.matricula === matricula)) {
        mostrarAlerta(`⚠️ O estudante ${nome} já consta na lista de presença.`);
        return;
      }

      listaPresenca.push({ nome, matricula });
      atualizarTabelaVisual();
      mostrarAlerta(`Presença registada de: ${nome} - Matrícula ${matricula}`);
    }

    function mostrarAlerta(mensagem) {
      const box = document.getElementById('alert-box');
      box.innerText = mensagem;
      box.style.display = 'block';
      setTimeout(() => {
        box.style.display = 'none';
      }, 4000);
    }

    function atualizarTabelaVisual() {
      const tbody = document.querySelector('#tabela-presenca tbody');
      tbody.innerHTML = '';

      if (listaPresenca.length === 0) {
        tbody.innerHTML = `<tr id="empty-row"><td colspan="3" style="text-align: center; color: #94a3b8;">Nenhum aluno registado ainda.</td></tr>`;
        return;
      }

      listaPresenca.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.matricula}</td>
          <td>${item.nome}</td>
          <td><strong style="color: #10b981;">P (Presente)</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Câmara em direto (Funciona perfeitamente no GitHub Pages devido ao HTTPS seguro)
    function iniciarLeitorQR() {
      const container = document.getElementById('reader-container');
      container.style.display = 'block';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          parseQRCodeData(decodedText);
        },
        (errorMessage) => {}
      ).catch((err) => {
        console.error("Erro ao iniciar câmara:", err);
        alert("Erro ao aceder à câmara. Certifique-se de permitir o acesso quando o navegador solicitar.");
        container.style.display = 'none';
      });
    }

    function pararLeitorQR() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById('reader-container').style.display = 'none';
        }).catch(err => {
          console.error("Erro ao parar câmara:", err);
          document.getElementById('reader-container').style.display = 'none';
        });
      } else {
        document.getElementById('reader-container').style.display = 'none';
      }
    }

    function parseQRCodeData(textoQr) {
      try {
        let nome = "Desconhecido";
        let matricula = "000000";

        if (textoQr.includes("Nome:") && textoQr.includes("Matrícula:")) {
          const partes = textoQr.split('|');
          nome = partes[0].replace("Nome:", "").trim();
          matricula = partes[1].replace("Matrícula:", "").trim();
        } else {
          matricula = textoQr.trim();
          nome = "Estudante (" + matricula + ")";
        }

        registrarPresenca(nome, matricula);
      } catch (e) {
        console.error("Erro ao descodificar QR Code", e);
      }
    }

    function salvarNoGoogleDrive() {
      if (listaPresenca.length === 0) {
        alert("Não há presenças registadas para salvar.");
        return;
      }

      const dadosAula = {
        instituicao: document.getElementById('inst').value,
        professor: "Thiago Thielmann de Araújo",
        disciplina: document.getElementById('disc').value,
        turma: document.getElementById('turma').value,
        data: document.getElementById('data-aula').value,
        presencas: listaPresenca
      };

      // Envia os dados para a API do Google Apps Script
      fetch(URL_API_GAS, {
        method: "POST",
        mode: "no-cors", // Necessário para chamadas externas ao Apps Script
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(dadosAula)
      })
      .then(() => {
        alert("🎉 Chamada salva com sucesso na planilha do Google Drive!");
        baixarCSVLocal(dadosAula.presencas);
      })
      .catch(err => {
        alert("Erro ao salvar: " + err);
      });
    }

    function baixarCSVLocal(presencas) {
      let csv = "Matrícula,Nome,Status\r\n";
      presencas.forEach(p => {
        csv += `${p.matricula},${p.nome},Presente (P)\r\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `chamada_${document.getElementById('data-aula').value.replace(/\//g, '-')}.csv`;
      link.click();
    }
  </script>
</body>
</html>
